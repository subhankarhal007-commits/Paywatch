    <!-- Telegram WebApp CloudStorage Polyfill & Compatibility Layer -->
    <script>
      (function() {
        try {
          // Suppress CloudStorage unsupported log from older Telegram webview versions
          var origError = console.error;
          console.error = function() {
            if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('CloudStorage is not supported in version') !== -1) {
              return;
            }
            return origError.apply(console, arguments);
          };

          if (window.Telegram && window.Telegram.WebApp) {
            var tg = window.Telegram.WebApp;
            var storagePrefix = 'tg_cloud_';

            var polyStorage = {
              setItem: function(key, value, callback) {
                try {
                  window.localStorage.setItem(storagePrefix + key, String(value));
                  if (typeof callback === 'function') setTimeout(function() { callback(null, true); }, 0);
                } catch (err) {
                  if (typeof callback === 'function') setTimeout(function() { callback(err, false); }, 0);
                }
                return tg.CloudStorage || polyStorage;
              },
              getItem: function(key, callback) {
                try {
                  var val = window.localStorage.getItem(storagePrefix + key);
                  if (typeof callback === 'function') setTimeout(function() { callback(null, val); }, 0);
                } catch (err) {
                  if (typeof callback === 'function') setTimeout(function() { callback(err, null); }, 0);
                }
                return tg.CloudStorage || polyStorage;
              },
              getItems: function(keys, callback) {
                try {
                  var res = {};
                  if (Array.isArray(keys)) {
                    keys.forEach(function(k) {
                      res[k] = window.localStorage.getItem(storagePrefix + k);
                    });
                  }
                  if (typeof callback === 'function') setTimeout(function() { callback(null, res); }, 0);
                } catch (err) {
                  if (typeof callback === 'function') setTimeout(function() { callback(err, {}); }, 0);
                }
                return tg.CloudStorage || polyStorage;
              },
              removeItem: function(key, callback) {
                try {
                  window.localStorage.removeItem(storagePrefix + key);
                  if (typeof callback === 'function') setTimeout(function() { callback(null, true); }, 0);
                } catch (err) {
                  if (typeof callback === 'function') setTimeout(function() { callback(err, false); }, 0);
                }
                return tg.CloudStorage || polyStorage;
              },
              removeItems: function(keys, callback) {
                try {
                  if (Array.isArray(keys)) {
                    keys.forEach(function(k) {
                      window.localStorage.removeItem(storagePrefix + k);
                    });
                  }
                  if (typeof callback === 'function') setTimeout(function() { callback(null, true); }, 0);
                } catch (err) {
                  if (typeof callback === 'function') setTimeout(function() { callback(err, false); }, 0);
                }
                return tg.CloudStorage || polyStorage;
              },
              getKeys: function(callback) {
                try {
                  var keys = [];
                  for (var i = 0; i < window.localStorage.length; i++) {
                    var k = window.localStorage.key(i);
                    if (k && k.indexOf(storagePrefix) === 0) {
                      keys.push(k.substring(storagePrefix.length));
                    }
                  }
                  if (typeof callback === 'function') setTimeout(function() { callback(null, keys); }, 0);
                } catch (err) {
                  if (typeof callback === 'function') setTimeout(function() { callback(err, []); }, 0);
                }
                return tg.CloudStorage || polyStorage;
              }
            };

            // Override CloudStorage methods directly if it already exists
            if (tg.CloudStorage) {
              for (var m in polyStorage) {
                tg.CloudStorage[m] = polyStorage[m];
              }
            } else {
              try {
                Object.defineProperty(tg, 'CloudStorage', {
                  value: polyStorage,
                  writable: true,
                  configurable: true,
                  enumerable: true
                });
              } catch (e) {
                tg.CloudStorage = polyStorage;
              }
            }
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>

    <!-- Global Guard for 3rd Party Ad Networks (Monetag / AdEx / Adsgram) -->
    <script>
      (function() {
        // Auto-dismiss any intrusive Adsgram error modal from blocking the user interface
        function dismissAdsgramErrorDialogs() {
          try {
            var divs = document.querySelectorAll('div');
            for (var i = 0; i < divs.length; i++) {
              var d = divs[i];
              if (
                d &&
                d.innerText &&
                (d.innerText.indexOf('AdsgramError') !== -1 ||
                  d.innerText.indexOf('not active') !== -1 ||
                  d.innerText.indexOf('blockId param') !== -1 ||
                  d.innerText.indexOf('launch parameters') !== -1 ||
                  d.innerText.indexOf('partner.adsgram.ai') !== -1)
              ) {
                d.style.display = 'none';
                if (d.parentNode && d.parentNode !== document.body) {
                  d.parentNode.style.display = 'none';
                }
              }
            }
          } catch (e) {}
        }
        setInterval(dismissAdsgramErrorDialogs, 100);

        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reason = event.reason;
            var text = typeof reason === 'string' ? reason : (reason && reason.message ? reason.message : String(reason || ''));
            if (
              /adex timeout/i.test(text) ||
              /ad timeout/i.test(text) ||
              /libtl/i.test(text) ||
              /adsgram/i.test(text) ||
              /launch parameters/i.test(text) ||
              /known source/i.test(text) ||
              /not active/i.test(text) ||
              /blockId param/i.test(text)
            ) {
              console.warn('🛡️ Handled Ad network notice gracefully:', text);
              dismissAdsgramErrorDialogs();
              if (typeof event.preventDefault === 'function') event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
              return true;
            }
          } catch (e) {}
        });

        window.addEventListener('error', function(event) {
          try {
            var msg = event.message || '';
            var src = event.filename || '';
            if (
              /adex timeout/i.test(msg) ||
              /libtl\.com/i.test(src) ||
              /sad\.min\.js/i.test(src) ||
              /adsgram/i.test(msg) ||
              /launch parameters/i.test(msg) ||
              /known source/i.test(msg) ||
              /not active/i.test(msg) ||
              /blockId param/i.test(msg)
            ) {
              console.warn('🛡️ Handled Ad script notice gracefully:', msg);
              dismissAdsgramErrorDialogs();
              if (typeof event.preventDefault === 'function') event.preventDefault();
              return true;
            }
          } catch (e) {}
        });
      })();
    </script>

    <!-- Adsgram Telegram Launch Parameters Bridge -->
    <script>
      (function() {
        try {
          var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
          var rawInitData = (tg && tg.initData && typeof tg.initData === 'string' && tg.initData.trim().length > 5)
            ? tg.initData
            : '';
          var platform = (tg && tg.platform) ? tg.platform : 'android';
          var version = (tg && tg.version) ? tg.version : '8.0';

          // If no raw initData from Telegram WebApp client yet, generate clean fallback
          if (!rawInitData) {
            var storedUid = localStorage.getItem('paywatch_user_id') || '5933272882';
            var mockUser = {
              id: Number(storedUid) || 5933272882,
              first_name: 'Subhankar',
              username: 'subhankar',
              language_code: 'en',
              allows_write_to_pm: true
            };
            rawInitData = 'user=' + encodeURIComponent(JSON.stringify(mockUser)) +
              '&auth_date=' + Math.floor(Date.now() / 1000) +
              '&hash=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855';
          }

          var paramsObj = {
            tgWebAppData: rawInitData,
            tgWebAppVersion: version,
            tgWebAppPlatform: platform,
            tgWebAppThemeParams: '{}'
          };
          var paramsJson = JSON.stringify(paramsObj);

          // Populate all storage keys queried by Adsgram sad.min.js parser
          sessionStorage.setItem('__telegram__initParams', paramsJson);
          sessionStorage.setItem('telegram-apps/launch-params', paramsJson);
          sessionStorage.setItem('adsgram/launch-params', paramsJson);
          sessionStorage.setItem('tma.js/launch-params', paramsJson);
          sessionStorage.setItem('tapps/launchParams', paramsJson);

          // Ensure window.location.hash has tgWebAppData for Adsgram url parser he()
          if (!window.location.hash || window.location.hash.indexOf('tgWebAppData') === -1) {
            try {
              var fakeHash = '#tgWebAppData=' + encodeURIComponent(rawInitData) + '&tgWebAppPlatform=' + platform + '&tgWebAppVersion=' + version;
              history.replaceState(null, '', window.location.pathname + window.location.search + fakeHash);
            } catch (err) {}
          }

          // Protect user from technical Adsgram error alert popups
          if (tg) {
            var origShowAlert = tg.showAlert;
            tg.showAlert = function(msg, callback) {
              if (typeof msg === 'string' && /adsgram|not active|launch param|blockId/i.test(msg)) {
                console.warn('Silenced Adsgram popup alert:', msg);
                if (typeof callback === 'function') callback();
                return;
              }
              if (origShowAlert) return origShowAlert.call(tg, msg, callback);
            };

            var origShowPopup = tg.showPopup;
            tg.showPopup = function(params, callback) {
              var m = (params && (params.message || params.title)) ? (params.title + ' ' + params.message) : '';
              if (/adsgram|not active|launch param|blockId/i.test(m)) {
                console.warn('Silenced Adsgram popup modal:', m);
                if (typeof callback === 'function') callback('close');
                return;
              }
              if (origShowPopup) return origShowPopup.call(tg, params, callback);
            };
          }
        } catch (e) {
          console.warn('Adsgram bridge init notice:', e);
        }
      })();
    </script>
